# /etc/nginx/sites-available/restaurant-booking.conf
# nginx в режиме обратного прокси: :80 -> api-gateway (127.0.0.1:3000)
upstream api_gateway {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # замените на домен, если он есть

    client_max_body_size 10m;

    access_log /var/log/nginx/restaurant-booking.access.log;
    error_log  /var/log/nginx/restaurant-booking.error.log;

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
